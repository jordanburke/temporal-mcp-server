name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # Manual redeploys (rollbacks, re-running after a secret change).
  workflow_dispatch:

# Never let two deploys race to the same Worker. Queue instead of cancelling —
# cancelling mid-deploy could leave the wrong version live.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gates the deploy on format, lint, typecheck, and the 34 tests —
      # including test/worker.spec.ts, which drives real Requests through the
      # Worker's fetch handler.
      - name: Validate
        run: pnpm validate

      # The Worker runs without nodejs_compat. This fails the build if any
      # `node:` import, bare Node builtin, or root `somamcp` specifier reaches
      # the worker bundle — a failure that would otherwise only appear at
      # runtime, after deploying.
      - name: Verify worker bundle is edge-safe
        run: pnpm check:worker

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Surface the deployed commit through the `info` tool and /info.
          command: deploy --var GIT_COMMIT:${{ github.sha }}
